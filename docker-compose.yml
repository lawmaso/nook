services:
  db:
    container_name: nookdb
    image: postgres:16
    environment:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook
      POSTGRES_DB: nookdb
    ports:
      - "5432:5432"
    volumes:
      - nookdb:/var/lib/postgresql/data
      - ./supabase/migrations/20261019030650_init_schema.sql:/docker-entrypoint-initdb.d/01-init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nook -d nookdb"]
      interval: 5s
      timeout: 3s
      retries: 4

volumes:
  nookdb: